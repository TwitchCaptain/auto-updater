name: build-and-release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      CGO_ENABLED: "0"
      CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install nsis, task, and wails3
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nsis
          go install github.com/go-task/task/v3/cmd/task@v3.45.4
          WAILS_VER="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VER}"
      - name: Fail closed without codesign and GoReleaser Pro
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CODESIGN_URL:-}" ]; then
            echo "CODESIGN_URL must be set in CI" >&2
            exit 1
          fi
          if [ -z "${GORELEASER_KEY:-}" ]; then
            echo "GORELEASER_PRO_KEY must be set in CI" >&2
            exit 1
          fi
      - name: Install golift codesign
        env:
          GOBIN: ${{ runner.temp }}/codesign-bin
        run: |
          set -euo pipefail
          mkdir -p "${GOBIN}"
          go install golift.io/codesign/cmd/codesign@v1.0.3
          echo "${GOBIN}" >> "${GITHUB_PATH}"
          echo "CODESIGN_BIN=${GOBIN}/codesign" >> "${GITHUB_ENV}"
      - name: Frontend and bindings
        run: |
          set -euo pipefail
          npm ci --prefix frontend
          GOOS=windows wails3 generate bindings -ts
          npm run build --prefix frontend
      - name: Package Windows amd64 and arm64
        env:
          CODESIGN_CLIENT_CERT: ${{ secrets.CODESIGN_CLIENT_CERT }}
          CODESIGN_CLIENT_KEY: ${{ secrets.CODESIGN_CLIENT_KEY }}
          CODESIGN_NAME: Captain Updater
          CODESIGN_WEBSITE: https://github.com/TwitchCaptain/auto-updater
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for arch in amd64 arm64; do
            wails3 package GOOS=windows GOARCH="${arch}"
            mkdir -p "artifacts/windows_${arch}"
            cp "bin/captain-updater.exe" "artifacts/windows_${arch}/captain-updater.exe"
            bash init/windows/signexe.sh "artifacts/windows_${arch}/captain-updater.exe"
            cp "bin/captain-updater-${arch}-installer.exe" "artifacts/captain-updater.${arch}.installer.exe"
            bash init/windows/signexe.sh "artifacts/captain-updater.${arch}.installer.exe"
          done
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> v2"
          args: release --clean --timeout 30m
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_KEY: ${{ secrets.GORELEASER_PRO_KEY }}
          USER: github-actions
          CODESIGN_URL: ${{ secrets.CODESIGN_URL }}
          CODESIGN_CLIENT_CERT: ${{ secrets.CODESIGN_CLIENT_CERT }}
          CODESIGN_CLIENT_KEY: ${{ secrets.CODESIGN_CLIENT_KEY }}
