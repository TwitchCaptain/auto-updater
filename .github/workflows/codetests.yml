name: test-and-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  gotest:
    strategy:
      matrix:
        os: [ubuntu, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Wails on Linux pulls GTK/WebKit via CGO. Unit tests stay native; the
      # GUI package and the Windows binary are compile-checked with GOOS=windows.
      - name: go-test
        if: matrix.os != 'ubuntu'
        run: go test -race -covermode=atomic '-test.v' ./internal/...
      - name: go-test
        if: matrix.os == 'ubuntu'
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./internal/... | grep -v '/internal/service$')
          go test -race -covermode=atomic '-test.v' "${pkgs[@]}"
          GOOS=windows CGO_ENABLED=0 go test -c -o /dev/null ./internal/service
          GOOS=windows CGO_ENABLED=0 go build -o /dev/null .
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    env:
      GOOS: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13
